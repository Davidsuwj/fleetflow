<g font-family="Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif">
<text x="55" y="52" font-size="32" fill="#202020" font-weight="700">公司公務車借用系統・資料表關聯圖</text>
<text x="55" y="91" font-size="20" fill="#646464" >僅主鍵（PK）加底線；外鍵（FK）以箭頭指向參照主鍵；複合主鍵各欄位分別加底線。</text>
