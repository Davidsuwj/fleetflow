<text x="55" y="1470" font-size="20" fill="#202020" >複合主鍵：保養 (vehicle_id, maintenance_date)；加油 (vehicle_id, refueling_date)。日期為各弱實體的部分鍵。</text>
<text x="55" y="1508" font-size="20" fill="#202020" >dispatches.application_id 為 UNIQUE：每筆申請最多一筆派車；員工與車輛的 M:N 經申請、派車連結。</text>
<text x="55" y="1546" font-size="19" fill="#646464" >聯絡電話為 ERD 的多值屬性，不是主鍵；本圖保留 ERD 原屬性，正規化電話儲存方式另見資料庫規格。</text>
</g></svg>