name: Verify FleetFlow
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fleetflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: fleetflow
      DB_USER: fleetflow
      DB_PASSWORD: ci-only-password
      SERVICE_API_KEY: ci-only-service-key-32-characters-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: node --check dist/app.js
      - run: python -m pytest -q
      - run: npm run check
      - run: npm test
      - run: npm run build
