<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7"><meta name="description" content="員工公務車借用：申請用車、追蹤自己的行程與借用統計。">
  <title>FleetFlow｜員工用車</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<div id="boot-status" class="boot-status" role="status">載入中…</div>
<section id="login-screen" class="auth-screen" hidden><form id="login-form" class="auth-card"><div class="wordmark">Fleet<span>Flow</span></div><h1>員工登入</h1><label for="login-employee">工號<input id="login-employee" name="employee_code" type="text" pattern="EMP[0-9]{4,19}" placeholder="EMP0001" maxlength="22" autocomplete="username" required></label><label for="login-password">密碼<input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><p id="login-error" class="form-error" role="alert"></p><button id="login-button" class="primary" type="submit">登入</button></form></section>
<div id="workspace" class="workspace" hidden>
  <aside class="sidebar"><a href="#overview" class="wordmark">Fleet<span>Flow</span><small>員工用車</small></a><nav id="nav" aria-label="主要導覽"></nav><div class="sidebar-footer"><span class="avatar" id="employee-avatar">F</span><div><strong id="employee-name">員工用車</strong><small id="employee-department">公司公務車借用系統</small></div></div></aside>
  <div class="main-shell"><header class="topbar"><span id="breadcrumb" hidden></span><div class="topbar-right"><span id="signed-in-name"></span><button type="button" id="logout-button" class="secondary">登出</button><span id="connection-state" class="connection" hidden>連線中</span><span id="today" hidden></span></div></header>
  <main id="main" tabindex="-1"><div class="page-heading"><div><h1 id="page-title">我的用車</h1></div><button id="add-button" class="primary" hidden>申請用車</button></div><div id="error-banner" class="error-banner" role="alert" hidden></div><div id="page-content" aria-live="polite"></div></main>
  </div>
</div>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="close-dialog" aria-label="關閉表單">×</button></div><div id="form-fields"></div><p id="form-error" role="alert" class="form-error"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">取消</button><button type="submit" class="primary" id="save-button">儲存</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
